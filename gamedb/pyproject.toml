[project]
name = "gamecove-gamedb"
version = "0.1.0"
description = "Builds GameCove's open game database from free, open sources"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# bare `pytest` inside gamedb/ finds the package without PYTHONPATH (review 2)
pythonpath = ["."]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gamedb", "gamedb.sources", "gamedb.firmware", "gamedb.firmware.sources"]
