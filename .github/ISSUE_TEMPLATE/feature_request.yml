name: Feature request
description: An idea that would make GameCove better.
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Bigger or open-ended ideas fit better in [Discussions > Ideas](https://github.com/IHulkSmashI/GameCove/discussions/categories/ideas), where others can chime in.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation, not the solution yet. "When I play on the bus I want..."
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you picture it working, with the controller in hand.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you handle it today?
      description: Workarounds, other apps that do it well (Steam's own UI, consoles, other launchers).
  - type: input
    id: device
    attributes:
      label: Your handheld (if it matters)
      placeholder: Legion Go 2
