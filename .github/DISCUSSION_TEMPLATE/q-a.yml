title: "[Q] "
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What you're trying to do and what you've tried.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Handheld and OS
      placeholder: ROG Ally X on Bazzite
  - type: input
    id: version
    attributes:
      label: GameCove version
      description: Settings > About GameCove.
