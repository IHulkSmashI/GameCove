title: "[Idea] "
labels: ["idea"]
body:
  - type: markdown
    attributes:
      value: Rough ideas are welcome. Say what you want to do, and others can add how they'd use it.
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What you'd like GameCove to do, and when it would help you.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Your handheld (if it matters)
