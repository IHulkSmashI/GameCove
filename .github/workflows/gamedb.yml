name: Nightly game database

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    defaults:
      run:
        working-directory: gamedb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install -e '.[test]'
      - run: pytest -q
      - name: Build
        # Each source falls back to last night's published data if it fails, so this
        # only fails when there is nothing at all to publish (the old file then stays).
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m gamedb.build --out dist/gamedb.json.gz --max-minutes 55
      - name: Build the Discover calendar (upcoming releases + ECB exchange rates)
        # Separate file and budget: a failure here never blocks gamedb.json.gz,
        # and the previous upcoming.json.gz then stays on the release.
        continue-on-error: true
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python -m gamedb.upcoming --out dist/upcoming.json.gz --max-minutes 12
      - name: Publish to the rolling "gamedb" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view gamedb >/dev/null 2>&1 || gh release create gamedb --title "Game database" --notes "Rebuilt nightly. Wikidata (CC0), AreWeAntiCheatYet (MIT), time to beat from IGDB.com. Compatibility tiers are GameCove's own summary of ProtonDB user reports (github.com/bdefore/protondb-data, ODbL 1.0), not ProtonDB's official ratings; the ProtonDB-derived data in this file is shared under the ODbL 1.0. upcoming.json.gz: release dates from Steam store data, Wikidata (CC0) and IGDB.com; exchange rates: Source: ECB statistics." --latest=false
          gh release upload gamedb dist/gamedb.json.gz --clobber
          if [ -s dist/upcoming.json.gz ]; then
            gh release upload gamedb dist/upcoming.json.gz --clobber
          fi
