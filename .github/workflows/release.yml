# Builds what packaging needs and the packages themselves:
#   app      Godot export -> gamecove-<version>-x86_64.tar.gz (gamecove.x86_64 + gamecove.pck at the top
#            level: Source1 of packaging/rpm/gamecove.spec, --app of packaging/sysext/build-sysext.sh)
#   package  in a Fedora container: the gyro fix's HID-BPF object (fixes/claw8ex-gyro/bpf/build-bpf.sh),
#            the RPM (rpmbuild, which builds the HID-BPF object again from source in %build) and the
#            SteamOS sysext (gamecove.raw, with the object copied in under fixes/)
#   tag      manual run with publish=true on main (only main: review problem 8): creates the v<spec Version>
#            tag on that commit and starts this workflow on the tag (GITHUB_TOKEN can start
#            workflow_dispatch runs); nothing else runs in that first run. publish=true on any other
#            branch fails.
#   release  only for tags v* on a commit that is on main: signs SHA256SUMS with cosign (keyless, this workflow's GitHub OIDC
#            identity for the tag: what packaging/get-gamecove.sh verifies), then publishes the
#            GitHub release with packaging/release-notes/<tag>.md: created as a draft, every file
#            uploaded, then published, so nobody sees a release without its files
# Every build run uploads the files as workflow artifacts. The release job runs in the "release" environment (the
# owner approves each signing run); the "Release tags" ruleset and that environment are in docs/RELEASING.md.
# Supply chain (review M6): actions are pinned by commit (tag in the comment), the Fedora container by
# digest, the Godot editor, its export template and Source2 (udev-hid-bpf) by sha256 below, and the bundled
# gamescope-session files per file (packaging/sysext/gamescope-session.sha256, fetched by git at a commit).
name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the v<spec Version> tag on this commit and publish the release"
        type: boolean
        default: false
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        default: true
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  GODOT: "4.7.2"
  # sha256 of Godot_v4.7.2-stable_linux.x86_64.zip and Godot_v4.7.2-stable_export_templates.tpz; both files'
  # sha512 match godotengine/godot's own SHA512-SUMS.txt for 4.7.2-stable (checked 2026-11-09)
  GODOT_EDITOR_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
  GODOT_TEMPLATES_SHA256: f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011
  # Source2: udev-hid-bpf-bbaad63.tar.gz from gitlab.freedesktop.org (same bytes on two downloads, 2026-11-09)
  UHB_SHA256: aab408afea76fab67b925225d6b4f0d28b226a9558ab6e750db79b12732e9ff8

jobs:
  tag:
    # releases are tagged from main only (review problem 8); see also the release job's main check
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Tag this commit and start the release run on the tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRE: ${{ inputs.prerelease }}
        run: |
          ver="$(sed -n 's/^Version:[[:space:]]*//p' packaging/rpm/gamecove.spec)"
          [ -n "$ver" ] || { echo "no Version in the spec" >&2; exit 1; }
          tag="v$ver"
          test -s "packaging/release-notes/$tag.md" || { echo "missing packaging/release-notes/$tag.md" >&2; exit 1; }
          have="$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq .object.sha 2>/dev/null || true)"
          if [ -n "$have" ] && [ "$have" != "$GITHUB_SHA" ]; then
            echo "$tag already exists on $have (this run is $GITHUB_SHA); bump Version in the spec" >&2
            exit 1
          fi
          [ -n "$have" ] || gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null
          # the full ref: a branch named like the tag must never be picked instead (review 2, low 22)
          gh workflow run release.yml --ref "refs/tags/$tag" -f prerelease="$PRE"
          echo "started the release run for $tag on $GITHUB_SHA"

  app:
    if: github.event_name != 'workflow_dispatch' || !inputs.publish || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Version (spec Version; a tag must match it)
        id: version
        env:
          PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: |
          if [ "$PUBLISH" = true ]; then
            echo "publish=true only tags from main; this run is on $GITHUB_REF" >&2
            exit 1
          fi
          ver="$(sed -n 's/^Version:[[:space:]]*//p' packaging/rpm/gamecove.spec)"
          [ -n "$ver" ] || { echo "no Version in the spec" >&2; exit 1; }
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v$ver" ]; then
            echo "tag ${GITHUB_REF_NAME} doesn't match the spec's Version $ver" >&2
            exit 1
          fi
          echo "version=$ver" >>"$GITHUB_OUTPUT"
      - name: Get Godot and its Linux export template
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT}-stable_linux.x86_64.zip"
          echo "${GODOT_EDITOR_SHA256}  godot.zip" | sha256sum -c -
          unzip -q godot.zip
          mv "Godot_v${GODOT}-stable_linux.x86_64" godot
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT}-stable_export_templates.tpz"
          echo "${GODOT_TEMPLATES_SHA256}  templates.tpz" | sha256sum -c -
          dest="$HOME/.local/share/godot/export_templates/${GODOT}.stable"
          mkdir -p "$dest"
          unzip -q -j templates.tpz templates/linux_release.x86_64 templates/version.txt -d "$dest"
          rm templates.tpz
          [ "$(cat "$dest/version.txt")" = "${GODOT}.stable" ]
      - name: Export (fails on script errors)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -o pipefail
          # The spec's Version is what About GameCove and the hint bar show (main.gd _version();
          # without it a release says "Development build").
          sed -i "/^config\/name=/a config/version=\"${VERSION}\"" app/project.godot
          grep -qx "config/version=\"${VERSION}\"" app/project.godot
          ./godot --headless --path app --import 2>&1 | tee import.log
          mkdir -p app/build
          ./godot --headless --path app --export-release "Linux" build/gamecove.x86_64 2>&1 | tee export.log
          ! grep -E "SCRIPT ERROR|Parse Error|Failed to load" import.log export.log
          test -x app/build/gamecove.x86_64
          test -s app/build/gamecove.pck
      - name: Licence texts are inside the app (review H8)
        run: |
          mkdir -p /tmp/pckls && touch /tmp/pckls/project.godot
          ./godot --headless --path /tmp/pckls -s "$PWD/packaging/tests/pck_files.gd" -- "$PWD/app/build/gamecove.pck" >pck-files.txt
          for f in res://CREDITS.md res://fonts/OFL-Outfit.txt res://fonts/OFL-PlusJakartaSans.txt \
            res://fonts/OFL-JetBrainsMono.txt res://addons/kenyoni/qr_code/LICENSE.md; do
            grep -qx "$f" pck-files.txt || { echo "missing from gamecove.pck: $f" >&2; exit 1; }
          done
      - name: App tarball (with licenses/)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          sh packaging/make-app-tarball.sh app/build "dist/gamecove-${VERSION}-x86_64.tar.gz"
          tar -tzf "dist/gamecove-${VERSION}-x86_64.tar.gz" | tee tarball-files.txt
          sed -n 's/^[^#][^ ]* \(.*\)$/licenses\/\1/p' packaging/licenses.list | while read -r f; do
            grep -qx "$f" tarball-files.txt || { echo "missing from the tarball: $f" >&2; exit 1; }
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app
          path: dist/gamecove-*-x86_64.tar.gz
          if-no-files-found: error

  package:
    needs: app
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # fedora:43, pinned by digest (the multi-arch index; review M6)
    container: fedora@sha256:f01112b9a1f1d0504ad962d9adfa401425033f8ab067e0a821904ebdde5b8ca5
    env:
      VERSION: ${{ needs.app.outputs.version }}
    steps:
      - name: Tools
        run: |
          dnf -y -q install git tar gzip curl rpm-build rpmdevtools systemd-rpm-macros \
            clang llvm libbpf-devel kernel-headers squashfs-tools python3
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: app
          path: dist
      - name: Source2 (udev-hid-bpf at the pinned commit, sha256 checked)
        run: |
          mkdir -p rpmbuild/SOURCES uhb
          spectool -g -s 2 -C rpmbuild/SOURCES packaging/rpm/gamecove.spec
          echo "${UHB_SHA256}  $(ls rpmbuild/SOURCES/udev-hid-bpf-*.tar.gz)" | sha256sum -c -
          tar -xzf rpmbuild/SOURCES/udev-hid-bpf-*.tar.gz -C uhb --strip-components=1
      - name: Gyro HID-BPF object (for the sysext; the RPM builds its own in %build)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          UHB_SRC="$PWD/uhb" sh fixes/claw8ex-gyro/bpf/build-bpf.sh
          test -s fixes/claw8ex-gyro/bpf/MSI__Claw-ISH-IMU.bpf.o
          cp fixes/claw8ex-gyro/bpf/MSI__Claw-ISH-IMU.bpf.o dist/
      - name: RPM
        run: |
          top="$PWD/rpmbuild"
          mkdir -p "$top/SOURCES"
          # Source0: the repository as the spec's URL would serve it (top folder gamecove-<version>)
          git archive --format=tar.gz --prefix="gamecove-${VERSION}/" -o "$top/SOURCES/gamecove-${VERSION}.tar.gz" HEAD
          # Source1: the app tarball from the app job
          cp "dist/gamecove-${VERSION}-x86_64.tar.gz" "$top/SOURCES/"
          # Source2: udev-hid-bpf, fetched and checked in the step before
          rpmbuild -ba --define "_topdir $top" packaging/rpm/gamecove.spec
          rpm -qlp "$top"/RPMS/x86_64/gamecove-*.rpm | tee rpm-files.txt
          grep -qx /usr/lib/gamecove/fixes/claw8ex-gyro/bpf/MSI__Claw-ISH-IMU.bpf.o rpm-files.txt
          grep -qx /usr/libexec/gamecove/gamecove-fix-set rpm-files.txt
          sed -n 's/^[^#][^ ]* \(.*\)$/\/usr\/share\/licenses\/gamecove\/\1/p' packaging/licenses.list | while read -r f; do
            grep -qx "$f" rpm-files.txt || { echo "missing from the RPM: $f" >&2; exit 1; }
          done
          cp "$top"/RPMS/x86_64/gamecove-*.rpm "$top"/SRPMS/gamecove-*.src.rpm dist/
      - name: Sysext
        run: |
          mkdir -p app-export
          tar -xzf "dist/gamecove-${VERSION}-x86_64.tar.gz" -C app-export
          sh packaging/sysext/build-sysext.sh --app app-export --out sysext 2>&1 | tee sysext.log
          ! grep -q "no gyro HID-BPF object" sysext.log
          unsquashfs -l sysext/gamecove.raw >sysext-files.txt
          sed -n 's/^[^#][^ ]* \(.*\)$/usr\/share\/licenses\/gamecove\/\1/p' packaging/licenses.list | while read -r f; do
            grep -q "/$f\$" sysext-files.txt || { echo "missing from the sysext: $f" >&2; exit 1; }
          done
          mv sysext/gamecove.raw "dist/gamecove-${VERSION}-x86_64.raw"
      - name: Installer bootstrap (get-gamecove.sh fetches itself from the release, checked against SHA256SUMS)
        run: cp packaging/get-gamecove.sh dist/
      - name: Checksums
        run: cd dist && sha256sum -- * | tee SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages
          path: |
            dist/*.rpm
            dist/*.raw
            dist/*.bpf.o
            dist/get-gamecove.sh
            dist/SHA256SUMS
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [app, package]
    # signing waits for the owner's approval: the "release" environment has him as required reviewer and allows only
    # main and v* tags (docs/RELEASING.md; review 2, problem 10)
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: |
            packaging/release-notes
            packaging/get-gamecove.sh
          sparse-checkout-cone-mode: false
      - name: The tagged commit is on main (review problem 8)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # "identical" or "behind": the tag's commit is main's head or one of its ancestors
          st="$(gh api "repos/$GH_REPO/compare/main...$GITHUB_SHA" --jq .status)"
          case "$st" in
          identical | behind) echo "$GITHUB_SHA is on main ($st)" ;;
          *) echo "$GITHUB_REF_NAME ($GITHUB_SHA) is not on main ($st); only commits on main are released" >&2; exit 1 ;;
          esac
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: cosign version (the one get-gamecove.sh pins; review L28)
        id: cosign
        run: echo "version=$(sed -n 's/^COSIGN_VERSION=//p' packaging/get-gamecove.sh)" >>"$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: ${{ steps.cosign.outputs.version }}
      - name: Sign SHA256SUMS (keyless; the identity get-gamecove.sh requires)
        env:
          REPO: ${{ github.repository }}
          tag: ${{ github.ref_name }}
        run: |
          # the very binary devices download: get-gamecove.sh's pinned sha256
          want="$(sed -n 's/^COSIGN_SHA256=//p' packaging/get-gamecove.sh)"
          echo "$want  $(command -v cosign)" | sha256sum -c -
          cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
          # the same check the installer makes, for this tag
          ident="(?i)^https://github\.com/$(printf '%s' "$REPO" | sed 's/[.]/\\./g')/\.github/workflows/release\.yml@refs/tags/$(printf '%s' "$tag" | sed 's/[][\\.*^$+?(){}|]/\\&/g')\$"
          cosign verify-blob --bundle dist/SHA256SUMS.sigstore.json \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "$ident" dist/SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRE_INPUT: ${{ inputs.prerelease }}
        run: |
          ls -la dist
          notes="packaging/release-notes/$TAG.md"
          test -s "$notes" || { echo "missing $notes" >&2; exit 1; }
          pre=""
          case "$PRE_INPUT" in
          true) pre="--prerelease" ;;
          false) ;;
          *) case "$TAG" in v0.* | *-*) pre="--prerelease" ;; esac ;;
          esac
          # draft first, files next, publish last (review L26): the installer never sees a release without
          # its SHA256SUMS and signature
          if gh release view "$TAG" >/dev/null 2>&1; then
            # a re-run never touches a release that is already out (it was set back to draft, review 2, low 22)
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != true ]; then
              echo "$TAG is already published; a re-run changes nothing" >&2
              exit 1
            fi
            gh release edit "$TAG" --notes-file "$notes" $pre
          else
            gh release create "$TAG" --draft --verify-tag --title "GameCove $TAG" --notes-file "$notes" $pre
          fi
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --draft=false
