name: CLA

# Every outside contributor signs docs/CLA.md once, by commenting on their pull
# request. Signatures are kept on the unprotected "cla-signatures" branch.
# CLA Assistant Lite (contributor-assistant/github-action), pinned by commit.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/IHulkSmashI/GameCove/blob/main/docs/CLA.md
          branch: cla-signatures
          allowlist: IHulkSmashI,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: "Thanks for the pull request! Before we can merge it, please read our [Contributor License Agreement](https://github.com/IHulkSmashI/GameCove/blob/main/docs/CLA.md). You keep your copyright; it lets the project owner license GameCove under other terms in the future. To sign, post the comment below."
