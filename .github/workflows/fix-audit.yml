name: Fix audit issues

# The nightly fix audit runs in the data repo (IHulkSmashI/GameCove-data, .github/workflows/fixes.yml): it fetches
# every fix's upstream watches, records only what a declared rule says, and publishes the signed fixes.json that
# handhelds read, with the audit's issues.json next to it (signed by the same workflow). This workflow files those
# issues here, where the fixes live, with this repo's own token: one issue per fix with a change (label fix-audit)
# plus a summary. It runs nothing from the data repo: it checks issues.json's cosign signature against exactly that
# workflow on the data repo's main, and tools/fixes/file_issues.py hands the cleaned text to gh as files.
# Weekly (Mondays) it also checks that every source and watch link in fixes/<id>/fix.json still answers.
#
# Three jobs: "nightly" and "links" fetch with a read-only token and no OIDC; only "issues", which runs nothing but
# gh on text those produced, can write issues.

on:
  schedule:
    - cron: "39 4 * * *"   # after the data repo's audit (fixes.yml, 03:09)
    - cron: "17 6 * * 1"   # the link check
  workflow_dispatch:
    inputs:
      links:
        description: "Run the source link check instead of filing the nightly audit's issues"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: fix-audit
  cancel-in-progress: false

jobs:
  nightly:
    if: github.ref == 'refs/heads/main' && github.event.schedule != '17 6 * * 1' && inputs.links != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: |
            packaging/get-gamecove.sh
            app/scripts/system/data_repo.gd
          sparse-checkout-cone-mode: false
      - name: cosign version (the one get-gamecove.sh pins)
        id: cosign
        run: echo "version=$(sed -n 's/^COSIGN_VERSION=//p' packaging/get-gamecove.sh)" >>"$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: ${{ steps.cosign.outputs.version }}
      - name: Tonight's issues.json from the data repo, if its signature checks out
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the very binary devices download: get-gamecove.sh's pinned sha256
          want="$(sed -n 's/^COSIGN_SHA256=//p' packaging/get-gamecove.sh)"
          echo "$want  $(command -v cosign)" | sha256sum -c -
          data="$(sed -n 's/^const REPO := "\(.*\)"$/\1/p' app/scripts/system/data_repo.gd)"
          ident="$(sed -n 's/^const FIXES_SIGNER := "\(.*\)"$/\1/p' app/scripts/system/data_repo.gd | sed 's/\\\\/\\/g')"
          [ -n "$data" ] && [ -n "$ident" ] || { echo "::error::data_repo.gd names no data repo or fixes signer"; exit 1; }
          mkdir -p dist
          gh release download fixes -R "$data" -p issues.json -p issues.json.sigstore.json -D dist
          cosign verify-blob --bundle dist/issues.json.sigstore.json \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "$ident" dist/issues.json
          # only tonight's: an audit that didn't run leaves yesterday's file, already filed
          python3 -I - dist/issues.json <<'PY'
          import datetime, json, sys
          doc = json.load(open(sys.argv[1], encoding="utf-8"))
          today = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d")
          if doc.get("date") != today:
              print("issues.json is from %s, not today: nothing to file" % doc.get("date"))
              json.dump({"date": doc.get("date"), "fixes": [], "summary": None, "unreachable": []}, open(sys.argv[1], "w"))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fix-audit-nightly
          path: dist/issues.json
          if-no-files-found: error
          retention-days: 7

  links:
    if: github.ref == 'refs/heads/main' && (github.event.schedule == '17 6 * * 1' || inputs.links == true)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Every source and watch link still answers
        run: |
          python3 tools/fixes/audit.py --links --out dist
          cat dist/summary.md >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fix-audit-links
          path: dist/issues.json
          if-no-files-found: error
          retention-days: 7

  issues:
    needs: [nightly, links]
    # whichever of the two ran
    if: always() && (needs.nightly.result == 'success' || needs.links.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/fixes/file_issues.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: fix-audit-*
          path: got
      - name: One issue per fix with a change, and a summary (label fix-audit)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -- got/*/issues.json
          python3 -I tools/fixes/file_issues.py "$@"
