name: Maker image links

# Every maker_image link in app/data/device_photos.json (the makers' own product images, which the app shows by link
# only and nobody copies) is requested once a week; ONE issue lists the broken ones, so a maker's site redesign is
# noticed within a week. Family rows ("<maker> (unknown model)") are covered through their representative model's
# link and listed by name. No image is stored anywhere. (The photos themselves are built and published by the
# GameCove-data repo's device-photos workflow; this check stays here because it reads this repo's data and files
# its issue here.)

on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  maker-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Request every maker image link (nothing is saved)
        id: check
        run: |
          set +e
          python tools/device_photos/makers.py --check --report broken.md
          code=$?
          set -e
          [ "$code" = 1 ] && exit 1
          echo "broken=$([ "$code" = 2 ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - name: Open, update or close the single "Broken maker image links" issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: Broken maker image links
          BROKEN: ${{ steps.check.outputs.broken }}
        run: |
          num=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title \
                --jq ".[] | select(.title == env.TITLE) | .number" | head -n1)
          if [ "$BROKEN" = yes ]; then
            if [ -n "$num" ]; then
              gh issue edit "$num" --body-file broken.md
            else
              gh issue create --title "$TITLE" --body-file broken.md
            fi
          elif [ -n "$num" ]; then
            gh issue close "$num" --comment "All maker image links answer with an image again."
          fi
