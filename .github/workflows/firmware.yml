name: Nightly firmware index

# The newest BIOS / EC / controller firmware each maker lists for every handheld in
# app/data/devices.json, plus upstream versions of the Linux driver stack, published as
# firmware.json.gz (+ .sha256) on the rolling "firmware" release. GameCove reads it at most
# weekly (app/scripts/system/firmware_index.gd). Nothing is mirrored: only versions and links.
# The file is signed with cosign keyless (firmware.json.gz.sigstore.json, this workflow's GitHub OIDC
# identity on main); the app offers maker downloads only from an index whose signature it checked
# (review M21, problem 1), and only from the device maker's own domains.
#
# Two jobs (review problem 2), as in release.yml: "build" runs the tests and the scrapers (third-party
# packages, maker web pages) with a read-only token and no OIDC; only "publish", which runs nothing but
# pinned cosign and gh on build's artifact, can mint the signing identity and write the release.

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  build:
    # the signing identity is this workflow on main: never build an index to publish from another branch
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: gamedb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install --require-hashes --no-deps -r ../tools/ci/requirements-pytest.txt
      - run: python -m pytest -q tests/test_firmware.py
      - name: Build
        # Each maker falls back to the previously published entry when its site fails, so
        # this only fails when there is nothing at all to publish (the old file then stays).
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m gamedb.firmware.build --out dist/firmware.json.gz --max-minutes 12
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: firmware-index
          path: gamedb/dist/firmware.json.gz
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # the rolling "firmware" release
      id-token: write   # cosign keyless (GitHub OIDC)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: |
            packaging/get-gamecove.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: firmware-index
          path: dist
      - name: Check the artifact (a schema-1 gzip index under the app's size cap; Python's standard library only)
        run: |
          python3 -I - dist/firmware.json.gz <<'PY'
          import gzip, json, sys
          raw = gzip.decompress(open(sys.argv[1], "rb").read())
          assert len(raw) <= 8 * 1024 * 1024, "larger than the app accepts"
          doc = json.loads(raw)
          assert doc.get("schema") == 1 and isinstance(doc.get("devices"), dict), "not a schema-1 index"
          PY
          (cd dist && sha256sum firmware.json.gz >firmware.json.gz.sha256)
      - name: cosign version (the one get-gamecove.sh pins)
        id: cosign
        run: echo "version=$(sed -n 's/^COSIGN_VERSION=//p' packaging/get-gamecove.sh)" >>"$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: ${{ steps.cosign.outputs.version }}
      - name: Sign the index (keyless; the identity the app checks)
        env:
          REPO: ${{ github.repository }}
        run: |
          # the very binary devices download: get-gamecove.sh's pinned sha256
          want="$(sed -n 's/^COSIGN_SHA256=//p' packaging/get-gamecove.sh)"
          echo "$want  $(command -v cosign)" | sha256sum -c -
          cosign sign-blob --yes --bundle dist/firmware.json.gz.sigstore.json dist/firmware.json.gz
          cosign verify-blob --bundle dist/firmware.json.gz.sigstore.json \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "(?i)^https://github\.com/$(printf '%s' "$REPO" | sed 's/[.]/\\./g')/\.github/workflows/firmware\.yml@refs/heads/main$" \
            dist/firmware.json.gz
      - name: Publish to the rolling "firmware" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view firmware >/dev/null 2>&1 || gh release create firmware --title "Firmware index" --notes "Rebuilt nightly from each handheld maker's public support listings (ASUS, Lenovo, MSI, Valve's jupiter-hw-support) and upstream release pages. Versions, dates and links only; no firmware is hosted here." --latest=false
          gh release upload firmware dist/firmware.json.gz dist/firmware.json.gz.sha256 dist/firmware.json.gz.sigstore.json --clobber
