name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # the same Godot editor release.yml pins (review M6); packaging/tests/release.sh keeps them equal
  GODOT_EDITOR_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4

jobs:
  gamedb:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: gamedb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install --require-hashes --no-deps -r ../tools/ci/requirements-pytest.txt
      - run: python -m pytest -q

  device-photos:
    # Offline checks of app/data/device_photos.json on every push: every row has a picture
    # source, each maker image link sits on that maker's own site (its _makers rules), family
    # rows name a representative. The weekly device-photos workflow does the network checks.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install --require-hashes --no-deps -r tools/ci/requirements-photos.txt
      - run: python -m pytest -q tools/device_photos
      - run: python tools/device_photos/makers.py

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GODOT: "4.7.2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Get Godot
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT}-stable/Godot_v${GODOT}-stable_linux.x86_64.zip"
          echo "${GODOT_EDITOR_SHA256}  godot.zip" | sha256sum -c -
          unzip -q godot.zip
          mv "Godot_v${GODOT}-stable_linux.x86_64" godot
      - name: Import and load the project (fails on script errors)
        run: |
          set -o pipefail
          ./godot --headless --path app --import 2>&1 | tee import.log
          # must also exit 0: a crash at shutdown (e.g. static caches outliving the renderer) fails here
          ./godot --headless --path app --quit-after 120 2>&1 | tee run.log
          ! grep -E "SCRIPT ERROR|Parse Error|Failed to load" import.log run.log
      - name: Device matrix fixtures (every devices.json row + generic AMD/Intel)
        run: |
          python3 -I tools/devicematrix/gen.py "$RUNNER_TEMP/devicematrix" --setups all
          echo "DEVICEMATRIX_DIR=$RUNNER_TEMP/devicematrix" >> "$GITHUB_ENV"
          echo "DEVICEMATRIX_REPORT=$RUNNER_TEMP/devicematrix-report.json" >> "$GITHUB_ENV"
      - name: GDScript tests (fail on failures, script errors and unexpected engine errors)
        run: |
          set -o pipefail
          ./godot --headless --path app -s res://tests/run_tests.gd 2>&1 | tee tests.log
          ! grep -E "SCRIPT ERROR|Parse Error|Failed to load" tests.log
      - name: Device matrix report (what every control detected on every handheld)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: devicematrix-report
          path: ${{ runner.temp }}/devicematrix-report.json
          if-no-files-found: ignore
      - name: Export preset packs the app
        run: |
          mkdir -p app/build
          ./godot --headless --path app --export-pack "Linux" build/gamecove.pck

  e2e:
    # The real app headless on three fake handhelds (Claw 8 EX / Bazzite, ROG Ally / SteamOS,
    # Legion Go S / Bazzite): quick menu, Settings, profiles and what reaches the system.
    # Long soak: E2E_SOAK=1 (200 iterations of the randomized parts).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT: "4.7.2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Get Godot
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT}-stable/Godot_v${GODOT}-stable_linux.x86_64.zip"
          echo "${GODOT_EDITOR_SHA256}  godot.zip" | sha256sum -c -
          unzip -q godot.zip
          mv "Godot_v${GODOT}-stable_linux.x86_64" godot
      - name: Import the project
        run: ./godot --headless --path app --import > /dev/null 2>&1
      - name: End-to-end suite (seed = run number, printed for replay)
        run: GODOT="$PWD/godot" python3 -I app/tests/e2e/run.py --iters 5 --seed "${{ github.run_number }}"

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Tools
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck rpm x11-utils
      - name: Testbed script
        run: shellcheck -S warning tools/testbed/*.sh && shellcheck -S warning -x -P tools/testbed/checks tools/testbed/checks/*.sh && sh tools/testbed/test.sh
      - name: Root fixes, dispatcher, session scripts and packaging
        run: sh packaging/tests/run.sh
      - name: RPM spec parses
        run: rpmspec -P packaging/rpm/gamecove.spec > /dev/null
