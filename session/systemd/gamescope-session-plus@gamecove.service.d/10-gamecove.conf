# Extra user services the GameCove session wants. Installed to
# /usr/lib/systemd/user/gamescope-session-plus@gamecove.service.d/.
# Bazzite links the same services into gamescope-session-plus@ogui-steam.service.wants;
# Wants= on a unit that isn't installed is ignored, so this is safe everywhere.
[Unit]
# D-Bus API for TDP, session switching (steamosctl) and more.
Wants=steamos-manager.service
# Bazzite: short/long power-button press handling.
Wants=steamos-powerbuttond.service
